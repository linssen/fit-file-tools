# Yarn configuration for FIT File Tools
# See: https://yarnpkg.com/configuration/yarnrc

# Enable offline cache for reproducible builds
# This ensures packages can be installed even if registry is unavailable
enableGlobalCache: false

# Cache configuration
cacheFolder: .yarn/cache

# Compression settings for cache
compressionLevel: mixed

# Lockfile settings
enableImmutableInstalls: false

# Network settings
httpTimeout: 60000
networkConcurrency: 8

# Enable telemetry (set to false for privacy)
enableTelemetry: false
