<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIT File Reader</title>
</head>
<body>
    <header>
        <h1>FIT File Reader</h1>
        <p>Upload and analyze Garmin FIT files directly in your browser</p>
    </header>

    <main>
        <section class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-content">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7,10 12,15 17,10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <h3>Drop FIT file here or click to browse</h3>
                    <p>Supports .fit files from Garmin devices</p>
                </div>
                <input type="file" id="fileInput" accept=".fit" hidden>
            </div>
        </section>

        <section class="results-section" id="resultsSection" style="display: none;">
            <h2>File Analysis</h2>
            <div class="file-info" id="fileInfo"></div>
            <div class="data-display" id="dataDisplay"></div>
        </section>
    </main>
</body>
</html>
