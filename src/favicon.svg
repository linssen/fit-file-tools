<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fitness/Activity icon with a running figure and heart rate line -->
  <defs>
    <style>
      .icon-bg { fill: #2563eb; }
      .icon-fg { fill: #ffffff; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" class="icon-bg"/>
  
  <!-- Running person -->
  <circle cx="13" cy="8" r="2.5" class="icon-fg"/>
  <path d="M 10 11 L 13 15 L 16 11 M 13 15 L 13 19 M 13 19 L 10 24 M 13 19 L 16 23" 
        stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Heart rate line -->
  <path d="M 19 17 L 20 17 L 21 14 L 22 20 L 23 17 L 24 17" 
        stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
